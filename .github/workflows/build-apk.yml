name: Build & Release APK

on:
  # Push a tag like v1.0.0 → build + attach the APK to a GitHub Release
  push:
    tags:
      - 'v*'
  # Manual trigger from the Actions tab → build + upload as a workflow artifact
  workflow_dispatch:

# The release step needs contents:write to create a Release and generate its
# release notes. Without this the default token is read-only and the
# softprops/action-gh-release step fails with HTTP 403.
permissions:
  contents: write

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        # The project's Gradle 8.9 / AGP 8.7.3 require JDK 17 (newer JDKs fail).
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug

      - name: Run unit tests
        run: ./gradlew :shared-core:testDebugUnitTest :telemetry-collector:testDebugUnitTest

      # Stable asset name → the "latest" download URL never changes between versions:
      #   https://github.com/CCrawford7/droidscan/releases/latest/download/droidscan.apk
      - name: Rename APK to stable name
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/droidscan.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: droidscan-apk
          path: dist/droidscan.apk

      - name: Create GitHub Release (tag push only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/droidscan.apk
          generate_release_notes: true
